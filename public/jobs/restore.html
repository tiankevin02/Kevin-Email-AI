async function restore() {
  const btn = document.getElementById("btn");
  const status = document.getElementById("status");
  btn.disabled = true;
  btn.textContent = "送信中...";
  status.textContent = "";
  try {
    const base = (document.getElementById("appurl").value || "").replace(/\/$/, "");
    const apiUrl = base ? base + "/api/jobs" : "/api/jobs";
    const res = await fetch(apiUrl, {
      method: "POST",
      headers: {"content-type": "application/json"},
      body: JSON.stringify(DATA)
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    status.innerHTML = '<span class="ok">✓ 復元完了！アプリを開いてください</span>';
    btn.textContent = "完了";
    setTimeout(() => { location.href = base ? base + "/jobs/" : "/jobs/"; }, 1500);
  } catch(e) {
    status.innerHTML = '<span class="err">エラー: ' + e.message + '</span>';
    btn.disabled = false;
    btn.textContent = "再試行";
  }
}
